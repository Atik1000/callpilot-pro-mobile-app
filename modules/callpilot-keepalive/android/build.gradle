plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'pro.callpilot'
version = '1.0.0'

android {
  namespace "expo.modules.callpilotkeepalive"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  implementation 'com.facebook.react:react-android'
  // Same version expo-notifications ships, so Gradle resolves a single copy.
  implementation 'com.google.firebase:firebase-messaging:25.0.1'
}
